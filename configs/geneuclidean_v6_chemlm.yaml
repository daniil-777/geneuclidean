name: geneuclidean-v6-chemlm
description: >-
  v6 flagship - PaiNN-SE3 + ChemLM decoder (GQA + QK-norm + KV cache + gated Flamingo
  pocket cross-attention) + Pocket CVAE + MultiTask (pKd/DrugCLIP/Props) + CFG.
  Decoder scale preset "small" (28.6M params), which is the compute-optimal size for
  de novo design: goal-directed generation saturates beyond ~5M params (NovoMolGen,
  arXiv:2508.13408 - PMO 16.48 @32M vs 16.70 @300M; docking -65.8 @5M vs -66.2 @1B),
  and for SMILES the fitted parameter exponent 0.0171 is ~25x smaller than the data
  exponent 0.4299 (arXiv:2601.22757). Spend compute on data and RL, not parameters.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_dir: data/metadata
  pocket_cutoff: 10.0
  graph_cutoff: 5.5
  max_neighbors: 24
  max_pocket_atoms: 384
  representation: smiles
  randomize_smiles: true
  max_seq_len: 128
  split_type: lp_pdbbind
  coord_jitter_std: 0.10
  atom_drop_prob: 0.05

encoder:
  arch: painn
  node_in_dim: 52
  hidden_dim: 192
  vector_dim: 64
  out_dim: 256
  num_layers: 4
  num_rbf: 24
  cutoff: 5.5
  e3nn_lmax: 1
  use_se3_chirality: true
  dropout: 0.1

cvae:
  enabled: true
  latent_dim: 64
  num_latent_tokens: 4
  kl_max_beta: 0.3
  kl_cycles: 4
  free_bits: 0.25

decoder:
  # ChemLM "small" preset. d_model/n_layers/n_heads/d_ff match SCALE_PRESETS["small"];
  # grouped-query attention uses n_kv_heads=2 from the factory default.
  arch: chemlm
  vocab_size: 96
  d_model: 512
  n_heads: 8
  # Grouped-query attention: 8 query heads share 2 K/V heads, as SCALE_PRESETS["small"]
  # specifies. Omitting this builds one K/V head per query head (plain multi-head), which
  # is 22.9% more parameters (33.76M vs 27.47M) and loses the preset's K/V saving.
  n_kv_heads: 2
  n_layers: 8
  d_ff: 1376
  max_seq_len: 128
  dropout: 0.1
  use_cross_attn: true
  gated_cross_attn: true
  cfg_drop_prob: 0.15

multitask:
  use_pkd_head: true
  use_clip_head: true
  use_prop_head: true
  lambda_pkd: 0.5
  lambda_clip: 0.3
  lambda_prop: 0.2
  clip_dim: 128
  ligand_fp_dim: 1024

train:
  seed: 42
  device: auto
  batch_size: 32
  epochs: 40
  lr: 0.0005
  encoder_lr: 0.0005
  decoder_lr: 0.00015
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_ratio: 0.08
  label_smoothing: 0.05
  freeze_decoder_epochs: 2
  num_workers: 0
  pretrained_decoder_ckpt: runs/pretrain_zinc_chemlm/best_prior.pt
  output_dir: runs/geneuclidean_v6_chemlm

sampling:
  strategy: min_p
  num_samples: 64
  max_len: 120
  temperature: 1.05
  min_p: 0.08
  top_p: 0.92
  top_k: 30
  cfg_scale: 1.75
  latent_temp: 1.0
  beam_width: 16
  num_beam_groups: 8
  diversity_penalty: 0.7
  repetition_penalty: 1.05
  syntax_guardrails: false

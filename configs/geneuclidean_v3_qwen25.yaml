name: geneuclidean-v3-qwen25
description: Track B Control — Frozen PaiNN-SE3 + Perceiver Resampler + Qwen2.5-0.5B (General LLM) LoRA

data:
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_dir: data/metadata
  pocket_cutoff: 10.0
  graph_cutoff: 5.5
  max_neighbors: 24
  max_pocket_atoms: 384
  representation: smiles
  randomize_smiles: false
  max_seq_len: 128
  split_type: casf2016
  coord_jitter_std: 0.0
  atom_drop_prob: 0.0

encoder:
  arch: painn
  node_in_dim: 52
  hidden_dim: 192
  vector_dim: 64
  out_dim: 256
  num_layers: 4
  num_rbf: 24
  cutoff: 5.5
  e3nn_lmax: 1
  use_se3_chirality: true
  dropout: 0.1

cvae:
  enabled: true
  latent_dim: 64
  num_latent_tokens: 4
  kl_max_beta: 0.3
  kl_cycles: 4
  free_bits: 0.25

decoder:
  arch: transformer
  vocab_size: 96
  d_model: 256
  n_heads: 8
  n_layers: 6
  d_ff: 688
  max_seq_len: 128
  dropout: 0.1
  use_cross_attn: true
  gated_cross_attn: true
  cfg_drop_prob: 0.15

multitask:
  use_pkd_head: true
  use_clip_head: true
  use_prop_head: true
  lambda_pkd: 0.5
  lambda_clip: 0.3
  lambda_prop: 0.2
  clip_dim: 128
  ligand_fp_dim: 1024

train:
  seed: 42
  device: auto
  batch_size: 8
  epochs: 5
  lr: 0.0001
  encoder_lr: 0.0005
  decoder_lr: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_ratio: 0.08
  label_smoothing: 0.0
  freeze_decoder_epochs: 1
  num_workers: 0
  pretrained_decoder_ckpt: null
  output_dir: runs/geneuclidean_v3_qwen25

sampling:
  strategy: min_p
  num_samples: 32
  max_len: 96
  temperature: 1.0
  min_p: 0.08
  top_p: 0.92
  top_k: 30
  cfg_scale: 1.6
  latent_temp: 1.0
  beam_width: 16
  num_beam_groups: 8
  diversity_penalty: 0.7
  repetition_penalty: 1.05
  syntax_guardrails: false

llm:
  backbone_id: Qwen/Qwen2.5-0.5B
  cache_dir: .hf_cache.nosync
  dtype: bfloat16
  v2_pocket_ckpt: runs/geneuclidean_v2_painn/best.pt
  freeze_pocket_encoder: true
  num_queries: 16
  perceiver_layers: 2
  perceiver_heads: 8
  num_global_tokens: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  phase_a_epochs: 1
  phase_b_epochs: 4
  projector_lr: 0.001
  phase_b_projector_lr: 0.0003
  lora_lr: 0.0001
  cfg_drop_prob: 0.15
  cvae_kl_weight: 0.05
  grad_accum_steps: 2

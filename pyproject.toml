[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geneuclidean"
version = "5.3.0"
description = "SE(3)-Equivariant 3D Molecular Encoding, Chemical NLP, NanoFold3 Co-Folding, Active Learning & Apple Circuit Studio for Structure-Based Drug Design"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Daniil Emtsev" }]
keywords = [
    "drug-design",
    "de-novo-generation",
    "equivariant-neural-networks",
    "alphafold3",
    "co-folding",
    "active-learning",
    "posebusters",
    "painn",
    "protein-ligand",
    "cheminformatics",
    "binding-affinity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    # CRITICAL: pin rdkit <2026.9 to avoid ARM64 MurckoDecompose RuntimeError ("bad any cast")
    "rdkit>=2026.3,<2026.9",
    "torch>=2.2",
    "e3nn>=0.5",
    "selfies>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "biopython>=1.83",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.66",
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "certifi>=2024.0",
]

[project.urls]
Homepage = "https://github.com/daniil-777/geneuclidean"
Documentation = "https://github.com/daniil-777/geneuclidean/blob/main/docs/library_api.md"
Changelog = "https://github.com/daniil-777/geneuclidean/blob/main/CHANGELOG.md"
Repository = "https://github.com/daniil-777/geneuclidean"
Issues = "https://github.com/daniil-777/geneuclidean/issues"
"Live 3D Studio" = "https://daniil-777.github.io/geneuclidean/"

[project.optional-dependencies]
cns = [
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "scipy>=1.11",
    "joblib>=1.3",
]
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pillow>=10.0",
]
viz3d = [
    "geneuclidean[viz]",
]
docking = [
    "meeko>=0.8",
    "gemmi>=0.7.5",
]
safe = [
    "safe-mol>=0.2",
]
pyg = [
    "torch-geometric>=2.5",
]
llm = [
    "transformers>=5.0",
    "peft>=0.15",
    "safetensors>=0.4",
    "accelerate>=1.0",
    "huggingface-hub>=1.0",
]
biophysics = [
    "openmm>=8.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]
all = [
    "geneuclidean[cns,viz,docking,pyg,llm,dev]",
]

[project.scripts]
geneuclidean = "geneuclidean.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geneuclidean*"]

[tool.setuptools.package-data]
geneuclidean = ["py.typed"]
"geneuclidean.biophysics" = ["_native/*.cpp"]
"geneuclidean.studio" = ["assets/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/geneuclidean/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["geneuclidean"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "accelerate.*",
    "Bio.*",
    "e3nn.*",
    "huggingface_hub.*",
    "matplotlib.*",
    "meeko.*",
    "networkx.*",
    "pandas.*",
    "peft.*",
    "rdkit.*",
    "requests.*",
    "safe.*",
    "safetensors.*",
    "scipy.*",
    "seaborn.*",
    "selfies.*",
    "sklearn.*",
    "tqdm.*",
    "transformers.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "equivariance: E(3)/SE(3) rotational, translational, and permutation equivariance tests",
    "slow: slow integration or end-to-end training tests",
]
filterwarnings = [
    "ignore:.*torch\\.jit\\.script.*is deprecated.*:FutureWarning",
    "ignore::FutureWarning:e3nn.*",
]

[tool.coverage.run]
source = ["geneuclidean"]
branch = true

[tool.coverage.report]
show_missing = true
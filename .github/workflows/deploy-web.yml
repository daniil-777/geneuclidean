name: Deploy GenEuclidean Web Studio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "results/figures/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check browser solver against reference trajectories
        working-directory: web
        run: npm run test:twin

      - name: Check circuit stage projections
        working-directory: web
        run: npm run test:circuit

      - name: Typecheck & Build production bundle
        working-directory: web
        run: npm run build

      - name: Test the built studio in Chromium
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
